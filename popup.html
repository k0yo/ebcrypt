<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EBCrypt Answers</title>
  <style>
    body {
      font-family: Roboto, Arial, sans-serif;
      font-size: 16px;
      color: green;
      margin: 0;
      padding: 10px;
      background: #fff;
      max-width: 600px;
      min-width: 400px;
      max-height: 600px;
      overflow-y: auto;
    }
    img{
      width: 24px;
      height: 24px;
    }
    .group-title {
      font-weight: bold;
      margin-top: 1em;
      color: #222;
    }
    .answer {
      margin-bottom: 0.5em;
    }
    #popout {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: transparent;
      border-radius: 1px;
    }
    #popout:hover {
      background-color: #eee;
    }
  </style>
</head>
<body>
  <div>
    <div id="popout">
      <img src="popout.png"></img>
    </div>
  </div>

  <div id="answers"><em>Loading...</em></div>
  <button id="copy">Copy Answers</button>
  <script src="popup.js"></script>
</body>
</html>
